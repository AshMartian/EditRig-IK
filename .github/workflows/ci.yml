name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editrig-tools/luau" "$RUNNER_TEMP/editrig-tools/rojo"
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.746/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
          echo '30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8  '"$RUNNER_TEMP/luau.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/editrig-tools/luau"
          curl --fail --location --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$RUNNER_TEMP/rojo.zip"
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  '"$RUNNER_TEMP/rojo.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/editrig-tools/rojo"
          chmod +x "$RUNNER_TEMP/editrig-tools/luau/luau" "$RUNNER_TEMP/editrig-tools/luau/luau-compile" "$RUNNER_TEMP/editrig-tools/rojo/rojo"
      - name: Validate and build
        env:
          LUAU_BIN: ${{ runner.temp }}/editrig-tools/luau/luau
          LUAU_COMPILE_BIN: ${{ runner.temp }}/editrig-tools/luau/luau-compile
          ROJO_BIN: ${{ runner.temp }}/editrig-tools/rojo/rojo
        run: python3 tools/build.py
      - name: Upload tested build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: EditRigIK-build
          path: build/current/
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download the validated build
        uses: actions/download-artifact@v8.0.2
        with:
          name: EditRigIK-build
          path: release
      - name: Create checksums
        working-directory: release
        run: sha256sum EditRigIK.rbxm EditRigIKRuntime.rbxm manifest.json > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Release tag must look like v1.2.3 or v1.2.3-alpha.1' >&2
            exit 1
          fi
          flags=()
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          cat > "$RUNNER_TEMP/release-notes.md" <<NOTES
          Experimental build from commit $SOURCE_SHA.

          The automated build runs portable tests and compiles Studio fixtures; it does not run the fixtures in Roblox Studio or verify the installed plugin. Back up your place and test on a copy of your rig.

          Install EditRigIK.rbxm in your local Studio Plugins folder. The runtime package and build manifest are provided separately. Verify downloads against SHA256SUMS.txt.
          NOTES
          gh release create "$RELEASE_TAG" --verify-tag --draft "${flags[@]}" \
            --title "EditRig IK $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md" \
            release/EditRigIK.rbxm release/EditRigIKRuntime.rbxm release/manifest.json release/SHA256SUMS.txt
          gh release edit "$RELEASE_TAG" --verify-tag --draft=false
