name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pinned build tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/editrig-tools/luau" "$RUNNER_TEMP/editrig-tools/rojo"
          curl --fail --location --retry 3 https://github.com/luau-lang/luau/releases/download/0.746/luau-ubuntu.zip -o "$RUNNER_TEMP/luau.zip"
          echo '30f11c9cde8be2dc0e3066d210705532aac3726a2db89a6c5078080b6faa6cf8  '"$RUNNER_TEMP/luau.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/luau.zip" -d "$RUNNER_TEMP/editrig-tools/luau"
          curl --fail --location --retry 3 https://github.com/rojo-rbx/rojo/releases/download/v7.7.1/rojo-7.7.1-linux-x86_64.zip -o "$RUNNER_TEMP/rojo.zip"
          echo '00feb4fa0829a1dd72b49df2639da519a352bfe13cadcd83969e2ba2bb5693c4  '"$RUNNER_TEMP/rojo.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rojo.zip" -d "$RUNNER_TEMP/editrig-tools/rojo"
          chmod +x "$RUNNER_TEMP/editrig-tools/luau/luau" "$RUNNER_TEMP/editrig-tools/luau/luau-compile" "$RUNNER_TEMP/editrig-tools/rojo/rojo"
      - name: Validate and build
        env:
          LUAU_BIN: ${{ runner.temp }}/editrig-tools/luau/luau
          LUAU_COMPILE_BIN: ${{ runner.temp }}/editrig-tools/luau/luau-compile
          ROJO_BIN: ${{ runner.temp }}/editrig-tools/rojo/rojo
        run: python3 tools/build.py
      - name: Upload tested build
        uses: actions/upload-artifact@v7.0.2
        with:
          name: EditRigIK-build
          path: build/current/
          if-no-files-found: error
          retention-days: 14
